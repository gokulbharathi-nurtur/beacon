<!DOCTYPE html>
<html>
<head><title>Capture engine fixture — click that would redirect</title></head>
<body>
<h1>Listing</h1>

<a id="view-details" href="click-redirects-destination.html">View details</a>

<script>
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ event: 'page_loaded' });

  // Fires before the browser navigates away — the classic "track the click, then leave"
  // pattern. The capture engine must not follow the navigation to see this.
  document.getElementById('view-details').addEventListener('click', function () {
    window.dataLayer.push({ event: 'property_click', target: 'details' });
  });
</script>
</body>
</html>
