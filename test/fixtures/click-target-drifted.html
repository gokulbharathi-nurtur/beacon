<!DOCTYPE html>
<html>
<head><title>Capture engine fixture — click target resolution (drifted)</title></head>
<body>
<!-- Same #unique-btn id as click-target.html, but relabeled — simulates a site edit that
     kept the id (so the stored selector still resolves) but swapped the button's purpose. -->
<button id="unique-btn">Discard changes</button>
<a id="unique-link" href="/docs">Read the docs</a>
<script>
  window.dataLayer = window.dataLayer || [];
  document.getElementById('unique-btn').addEventListener('click', function () {
    window.dataLayer.push({ event: 'discard_changes_click', click_text: 'Discard changes' });
  });
</script>
</body>
</html>
