<!DOCTYPE html>
<html>
<head><title>Capture engine fixture — click target resolution</title></head>
<body>
<button id="unique-btn">Save changes</button>
<a id="unique-link" href="/docs">Read the docs</a>
<button class="dup">Click me</button>
<button class="dup">Click me too</button>
<script>
  window.dataLayer = window.dataLayer || [];
  document.getElementById('unique-btn').addEventListener('click', function () {
    window.dataLayer.push({ event: 'save_changes_click', click_text: 'Save changes' });
  });
</script>
</body>
</html>
