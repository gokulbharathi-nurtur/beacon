<!DOCTYPE html>
<html>
<head><title>Capture engine fixture — two independent click steps</title></head>
<body>
<button id="step-a">Step A</button>
<button id="step-b">Step B</button>

<script>
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ event: 'page_loaded' });

  document.getElementById('step-a').addEventListener('click', function () {
    window.dataLayer.push({ event: 'step_a_clicked' });
  });
  document.getElementById('step-b').addEventListener('click', function () {
    window.dataLayer.push({ event: 'step_b_clicked' });
  });
</script>
</body>
</html>
