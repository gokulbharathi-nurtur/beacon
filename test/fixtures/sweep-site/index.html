<!DOCTYPE html>
<html>
<head><title>Sweep fixture — home</title></head>
<body>
<h1>Home</h1>
<a href="about.html">About</a>
<button id="track-btn">Track me</button>
<button id="silent-btn">Silent button</button>
<button id="broken-btn">Broken tracking</button>
<script>
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ event: 'page_loaded' });

  document.getElementById('track-btn').addEventListener('click', function () {
    window.dataLayer.push({ event: 'button_clicked' });
  });
  // #silent-btn deliberately has no listener — the "someone forgot to add tracking" case.
  document.getElementById('broken-btn').addEventListener('click', function () {
    // A real catalog event name pushed with none of its fields — a genuine schema violation.
    window.dataLayer.push({ event: 'click_footer' });
  });
</script>
</body>
</html>
