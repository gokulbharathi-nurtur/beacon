<!DOCTYPE html>
<html>
<head><title>Capture engine fixture — navigation, page 1</title></head>
<body>
<h1>Page 1</h1>
<script>
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ event: 'nav_page_1_loaded' });

  // A real full-page navigation (not a fetch/pushState), same as clicking a plain <a href>.
  // Deliberately not instant: proves the push above had time to land before the document
  // it belongs to is torn down.
  setTimeout(function () {
    window.location.href = 'nav-page-2.html';
  }, 300);
</script>
</body>
</html>
